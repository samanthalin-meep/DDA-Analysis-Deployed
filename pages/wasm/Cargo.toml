[package]
name = "ddalab-browser"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
rayon = "1.11"
web-time = "1.1"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
