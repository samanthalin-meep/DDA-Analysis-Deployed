name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            pages
            vendor/dda-rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI dependencies
        working-directory: pages
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Rust and WebAssembly target
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown && rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pages/wasm
      - name: Install WebAssembly bindings
        run: |
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.104/wasm-bindgen-0.2.104-x86_64-unknown-linux-musl.tar.gz --output "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          echo "9553740907c2c1008f9a44bb00ed1f5b39ffc55d9d331581b5aebc891a4b772f  $RUNNER_TEMP/wasm-bindgen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/wasm-bindgen-0.2.104-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
      - name: Build original DDA engine
        working-directory: pages
        run: pnpm run wasm
      - name: Get verified browser Python runtime
        working-directory: pages
        run: pnpm run runtime
      - name: Check and build
        working-directory: pages
        run: |
          pnpm run check
          pnpm run build
          node tests/verify-engine.mjs
          node tests/verify-recording-input.mjs
          node tests/verify-condition-timing.mjs
          node tests/verify-signal-labels.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
